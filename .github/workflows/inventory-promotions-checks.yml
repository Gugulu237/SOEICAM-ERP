name: Inventory margins and degustation checks
on:
  pull_request:
    paths:
      - 'src/components/distribution/CentralDegustationForm.jsx'
      - 'src/components/sales/PromotionExchangeHistory.jsx'
      - 'src/components/inventory/**'
      - 'src/components/items/FinishedGoodsMargin.jsx'
      - 'src/lib/finished-goods-margin.js'
      - 'src/server/domain/inventory-overview.js'
      - 'src/server/domain/central-degustation.js'
      - 'tests/finished-goods-margin*.test.mjs'
      - 'tests/central-degustation*.test.mjs'
      - 'tests/promotion-history-ui.test.mjs'
      - 'tests/inventory-workspace.test.mjs'
      - 'package*.json'
      - '.github/workflows/inventory-promotions-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify inventory costs, margins and promotional issues
        run: node --test --test-concurrency=2 tests/finished-goods-margin.test.mjs tests/finished-goods-margin-ui.test.mjs tests/inventory-workspace.test.mjs tests/inventory-streamlined-ui.test.mjs tests/current-stock-ui.test.mjs tests/promotion-history-ui.test.mjs tests/central-degustation.test.mjs tests/central-degustation-ui.test.mjs tests/degustation.test.mjs tests/degustation-appropriation.test.mjs tests/assembly-pricing.test.mjs
      - name: Lint changed interfaces
        run: npx eslint src/components/distribution/CentralDegustationForm.jsx src/components/sales/PromotionExchangeHistory.jsx src/components/inventory/GroupedItems.jsx src/components/inventory/MobileStockList.jsx src/components/items/FinishedGoodsMargin.jsx --quiet
      - name: Build application
        run: npm run build
